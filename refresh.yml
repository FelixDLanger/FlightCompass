name: Refresh flight data

# Runs weekly Tuesday 06:00 UTC (airlines typically push weekly fare sales then).
# Also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      month:
        description: 'Departure month filter (YYYY-MM, optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch Travelpayouts snapshot
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          # Sanity check: script must exist in repo root
          if [ ! -f "fetch_snapshot.py" ]; then
            echo "::error::fetch_snapshot.py not found in repo root."
            echo "Files present in repo root:"
            ls -la
            exit 1
          fi
          # Sanity check: token must be set
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::TRAVELPAYOUTS_TOKEN secret is not set."
            echo "Add it: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -n "${{ github.event.inputs.month }}" ]; then
            python3 fetch_snapshot.py --month "${{ github.event.inputs.month }}"
          else
            python3 fetch_snapshot.py
          fi

      - name: Fetch Hotellook hotel snapshot
        # Non-critical: continues on error so flight data refresh still commits.
        continue-on-error: true
        run: |
          if [ -f "fetch_hotels.py" ]; then
            python3 fetch_hotels.py || echo "Hotel fetch failed but continuing"
          else
            echo "fetch_hotels.py not present — skipping hotel snapshot"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage both data files (whichever changed)
          git add flight-data.json hotel-data.json 2>/dev/null || true
          if [ -n "$(git status --porcelain flight-data.json hotel-data.json 2>/dev/null)" ]; then
            git commit -m "Refresh data snapshots [skip ci]"
            git push
            echo "Snapshots refreshed and committed."
          else
            echo "No changes to snapshots."
          fi
