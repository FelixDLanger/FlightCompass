name: Refresh flight data manual

# Runs weekly Tuesday 06:00 UTC (airlines typically push weekly fare sales Tuesday morning).
# Also runnable manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Aviasales snapshot
        run: |
          python3 fetch_snapshot.py --origins BKK,SIN,FRA,LHR,DXB --period year

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain flight-data.json)" ]; then
            git add flight-data.json
            git commit -m "Refresh flight-data.json [skip ci]"
            git push
            echo "Snapshot refreshed and committed."
          else
            echo "No changes to snapshot."
          fi
