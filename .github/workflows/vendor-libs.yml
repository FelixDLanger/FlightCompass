# One-off: copy the map libraries the page used to load from public CDNs into vendor/,
# so visitors' browsers make no requests to third parties.
# Each file comes from the npm registry (npm checks its integrity) and is compared byte for byte
# with the CDN copy the page loaded before. Run by hand: Actions -> Vendor map libraries -> Run workflow.
name: Vendor map libraries

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vendor-libs
  cancel-in-progress: false

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Fetch from npm and compare with the CDN copies
        run: |
          set -euo pipefail
          shopt -s nullglob
          work="$(mktemp -d)"
          (cd "$work" && npm pack d3@7.8.5 topojson@3.0.2 world-atlas@2.0.2 >/dev/null)
          for t in "$work"/*.tgz; do d="${t%.tgz}"; mkdir -p "$d"; tar -xzf "$t" -C "$d"; done
          mkdir -p vendor
          cp "$work/d3-7.8.5/package/dist/d3.min.js" vendor/d3-7.8.5.min.js
          cp "$work/topojson-3.0.2/package/dist/topojson.min.js" vendor/topojson-3.0.2.min.js
          cp "$work/world-atlas-2.0.2/package/countries-110m.json" vendor/world-atlas-2.0.2-countries-110m.json
          for pkg in d3-7.8.5 topojson-3.0.2 world-atlas-2.0.2; do
            found=0
            for f in "$work/$pkg/package/"LICEN[CS]E*; do cp "$f" "vendor/${pkg%-*}-$(basename "$f")"; found=1; done
            [ "$found" = 1 ] || { echo "::error::no license file in $pkg"; exit 1; }
          done
          compare() {
            if curl -fsSL "$1" | cmp -s - "$2"; then echo "| $(basename "$2") | identical to $1 |"; else echo "| $(basename "$2") | DIFFERS from $1 |"; fi
          }
          {
            echo "### Vendored files"
            echo ""
            echo "| File | CDN check |"
            echo "|---|---|"
            compare https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js vendor/d3-7.8.5.min.js
            compare https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js vendor/topojson-3.0.2.min.js
            compare https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json vendor/world-atlas-2.0.2-countries-110m.json
            echo ""
            echo '```'
            sha256sum vendor/*
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Vendor d3 7.8.5, topojson 3.0.2 and world-atlas 2.0.2 from npm"
          git push origin "HEAD:${GITHUB_REF_NAME}"
