name: Refresh flight data

# Weekly snapshot of cached Aviasales fares via the Travelpayouts Data API.
# Tuesday 06:00 UTC catches airlines' weekly sale cycle. Can also be run by hand
# (Actions tab -> Refresh flight data -> Run workflow), optionally for one month.
on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional departure month, YYYY-MM (leave empty for all dates)"
        required: false
        default: ""
      hotel_probe:
        description: "Agoda test only: fetch Bangkok hotel rates, print the result, change nothing"
        type: boolean
        required: false
        default: false
      flight_probe:
        description: "Flight data test only: search a sample of routes, print how airports are labelled, change nothing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# Never let two refreshes push at the same time. Test runs push nothing, so each gets its own
# group and can run while a refresh is in progress.
concurrency:
  group: ${{ (github.event.inputs.hotel_probe == 'true' || github.event.inputs.flight_probe == 'true') && format('refresh-test-{0}', github.run_id) || 'refresh-flight-data' }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Flight data test (prints how the API labels airports, changes nothing)
        if: ${{ github.event.inputs.flight_probe == 'true' }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: |
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::TRAVELPAYOUTS_TOKEN secret is not set."
            exit 1
          fi
          python3 fetch_snapshot.py --probe

      - name: Fetch Travelpayouts snapshot
        if: ${{ github.event.inputs.hotel_probe != 'true' && github.event.inputs.flight_probe != 'true' }}
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # Passed through the environment, not pasted into the script, so the input can't inject shell code
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ ! -f "fetch_snapshot.py" ]; then
            echo "::error::fetch_snapshot.py not found in repo root."
            ls -la
            exit 1
          fi
          if [ -z "$TRAVELPAYOUTS_TOKEN" ]; then
            echo "::error::TRAVELPAYOUTS_TOKEN secret is not set."
            echo "Add it: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          if [ -n "$MONTH" ]; then
            if ! echo "$MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$'; then
              echo "::error::month must look like 2026-11"
              exit 1
            fi
            python3 fetch_snapshot.py --month "$MONTH"
          else
            python3 fetch_snapshot.py
          fi

      # Hotel rates are optional: without the AGODA_API_KEY secret the step skips itself, and a failed
      # run leaves the previous hotel-data.json in place (the page falls back to its benchmarks).
      - name: Fetch Agoda hotel rates
        if: ${{ github.event.inputs.flight_probe != 'true' }}
        continue-on-error: true
        env:
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}
          AGODA_SITE_ID: "1979359"
          HOTEL_PROBE: ${{ github.event.inputs.hotel_probe }}
        run: |
          if [ -z "$AGODA_API_KEY" ]; then
            echo "AGODA_API_KEY secret is not set; skipping hotel rates."
            exit 0
          fi
          if [ ! -f "fetch_hotels.py" ]; then
            echo "::warning::fetch_hotels.py not found in repo root; skipping hotel rates."
            exit 0
          fi
          if [ "$HOTEL_PROBE" = "true" ]; then
            python3 fetch_hotels.py --probe
          else
            python3 fetch_hotels.py || { echo "::warning::Agoda hotel fetch failed; the previous hotel-data.json stays in place."; exit 1; }
          fi

      - name: Commit and push if changed
        if: ${{ github.event.inputs.hotel_probe != 'true' && github.event.inputs.flight_probe != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage each data file only if it exists ("git add" of a missing file aborts the whole commit).
          git add flight-data.json
          if [ -f hotel-data.json ]; then git add hotel-data.json; fi
          if git diff --cached --quiet; then
            echo "No changes to snapshot."
          else
            git commit -m "Refresh flight and hotel data [skip ci]"
            git push
            echo "Snapshot refreshed and committed."
          fi
